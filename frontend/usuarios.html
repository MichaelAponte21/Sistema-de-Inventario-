<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuarios | Sistema de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { prefix: "tw-", corePlugins: { preflight: false } };
    </script>
    <link href="./css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbar-container"></div>
    <main class="container py-4 py-lg-5">
      <header class="page-header d-flex flex-column flex-lg-row align-items-lg-end justify-content-between gap-3">
        <div>
          <p class="text-uppercase text-secondary fw-semibold small mb-2">Módulo</p>
          <h1>Usuarios</h1>
          <p class="text-secondary mb-0">Gestión de usuarios (alta, edición, cambio de password y activación).</p>
        </div>
        <button id="new-user-button" class="btn btn-primary" type="button">
          <i class="bi bi-person-plus me-1"></i>Nuevo usuario
        </button>
      </header>

      <section class="page-section p-3 p-lg-4 table-panel">
        <div id="users-table"></div>
      </section>

      <div class="modal fade" id="user-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content border-0 shadow-lg">
            <div class="modal-header">
              <h2 id="user-modal-title" class="modal-title fs-5">Nuevo usuario</h2>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <form id="user-form" novalidate>
              <div class="modal-body">
                <input id="user-id" type="hidden" />
                <div id="user-form-feedback" class="alert alert-danger d-none" role="alert"></div>
                <div class="mb-3">
                  <label class="form-label" for="user-name">Nombre</label>
                  <input id="user-name" class="form-control" type="text" maxlength="100" required />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="user-email">Email</label>
                  <input id="user-email" class="form-control" type="email" required />
                </div>
                <div class="mb-3">
                  <label class="form-label" for="user-role">Rol</label>
                  <select id="user-role" class="form-select" required>
                    <option value="ADMIN">ADMIN</option>
                    <option value="EMPLEADO">EMPLEADO</option>
                  </select>
                </div>
                <div id="user-password-group">
                  <label class="form-label" for="user-password">Contraseña</label>
                  <input id="user-password" class="form-control" type="password" minlength="8" maxlength="100" />
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button id="user-save-button" class="btn btn-primary" type="submit">Guardar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div class="modal fade" id="user-password-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content border-0 shadow-lg">
            <div class="modal-header">
              <h2 class="modal-title fs-5">Cambiar contraseña</h2>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <form id="user-password-form" novalidate>
              <div class="modal-body">
                <input id="user-password-id" type="hidden" />
                <div id="user-password-feedback" class="alert alert-danger d-none" role="alert"></div>
                <div>
                  <label class="form-label" for="user-password-new">Nueva contraseña</label>
                  <input id="user-password-new" class="form-control" type="password" minlength="8" maxlength="100" required />
                </div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button id="user-password-save-button" class="btn btn-primary" type="submit">Actualizar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/modules/usuarios.js"></script>
  </body>
</html>
