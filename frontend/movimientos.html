<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movimientos | Sistema de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { prefix: "tw-", corePlugins: { preflight: false } };
    </script>
    <link href="./css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbar-container"></div>
    <main class="container py-4 py-lg-5">
      <header class="page-header d-flex flex-column flex-lg-row align-items-lg-end justify-content-between gap-3">
        <div>
          <p class="text-uppercase text-secondary fw-semibold small mb-2">Módulo</p>
          <h1>Movimientos</h1>
          <p class="text-secondary mb-0">Registro de entradas y salidas con historial filtrable por producto.</p>
        </div>
      </header>

      <section class="page-section p-3 p-lg-4 mb-4">
        <h2 class="h5 mb-3">Nuevo movimiento</h2>
        <form id="movement-form" class="row g-3" novalidate>
          <div id="movement-form-feedback" class="col-12 alert alert-danger d-none mb-0" role="alert"></div>
          <div class="col-12 col-lg-4">
            <label class="form-label" for="movement-product">Producto</label>
            <select id="movement-product" class="form-select" required></select>
          </div>
          <div class="col-12 col-lg-3">
            <label class="form-label" for="movement-type">Tipo</label>
            <select id="movement-type" class="form-select" required>
              <option value="ENTRADA">ENTRADA</option>
              <option value="SALIDA">SALIDA</option>
            </select>
          </div>
          <div class="col-12 col-lg-2">
            <label class="form-label" for="movement-quantity">Cantidad</label>
            <input id="movement-quantity" class="form-control" type="number" min="1" required />
          </div>
          <div class="col-12 col-lg-3">
            <label class="form-label" for="movement-note">Observación</label>
            <input id="movement-note" class="form-control" type="text" maxlength="500" />
          </div>
          <div class="col-12 d-flex align-items-center justify-content-between">
            <small id="movement-stock-hint" class="text-secondary"></small>
            <button id="movement-submit-button" class="btn btn-primary" type="submit">
              <i class="bi bi-check2-circle me-1"></i>Registrar movimiento
            </button>
          </div>
        </form>
      </section>

      <section class="page-section p-3 p-lg-4 table-panel">
        <ul class="nav nav-tabs mb-3" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#movements-all-tab" type="button" role="tab">
              Todos los movimientos
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#movements-by-product-tab" type="button" role="tab">
              Por producto
            </button>
          </li>
        </ul>

        <div class="tab-content">
          <div class="tab-pane fade show active" id="movements-all-tab" role="tabpanel">
            <div id="movements-table-all"></div>
          </div>
          <div class="tab-pane fade" id="movements-by-product-tab" role="tabpanel">
            <div class="row g-3 align-items-end mb-3">
              <div class="col-12 col-lg-5">
                <label class="form-label" for="movement-filter-product">Filtrar por producto</label>
                <select id="movement-filter-product" class="form-select">
                  <option value="">Selecciona un producto</option>
                </select>
              </div>
            </div>
            <div id="movements-table-by-product"></div>
          </div>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/modules/movimientos.js"></script>
  </body>
</html>
