<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reportes | Sistema de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { prefix: "tw-", corePlugins: { preflight: false } };
    </script>
    <link href="./css/app.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbar-container"></div>
    <main class="container py-4 py-lg-5">
      <header class="page-header d-flex flex-column flex-lg-row align-items-lg-end justify-content-between gap-3">
        <p class="text-uppercase text-secondary fw-semibold small mb-2">Módulo</p>
        <h1>Reportes</h1>
        <p class="text-secondary mb-0">Vistas de inventario y movimientos con exportación CSV.</p>
      </header>

      <section class="page-section p-3 p-lg-4 mb-4">
        <ul class="nav nav-tabs" id="report-tabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#report-inventory" type="button" role="tab">Inventario</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#report-movements" type="button" role="tab">Movimientos</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#report-low-stock" type="button" role="tab">Stock bajo</button>
          </li>
          <li id="report-users-tab-item" class="nav-item d-none" role="presentation">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#report-users" type="button" role="tab">Usuarios</button>
          </li>
        </ul>
        <div class="tab-content pt-3">
          <div class="tab-pane fade show active" id="report-inventory" role="tabpanel">
            <div class="row g-3 mb-3">
              <div class="col-12 col-md-8">
                <label class="form-label" for="report-inventory-search">Buscar producto</label>
                <input id="report-inventory-search" class="form-control" type="search" placeholder="Nombre o categoría" />
              </div>
              <div class="col-12 col-md-4">
                <label class="form-label" for="report-inventory-category">Categoría</label>
                <select id="report-inventory-category" class="form-select">
                  <option value="">Todas</option>
                </select>
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h6 mb-0">Inventario actual</h2>
              <button id="export-inventory-csv" class="btn btn-outline-primary btn-sm" type="button">
                <i class="bi bi-download me-1"></i>Exportar CSV
              </button>
            </div>
            <div id="report-inventory-table"></div>
          </div>
          <div class="tab-pane fade" id="report-movements" role="tabpanel">
            <div class="row g-3 mb-3">
              <div class="col-12 col-md-4">
                <label class="form-label" for="report-movements-type">Tipo</label>
                <select id="report-movements-type" class="form-select">
                  <option value="">Todos</option>
                  <option value="ENTRADA">ENTRADA</option>
                  <option value="SALIDA">SALIDA</option>
                </select>
              </div>
              <div class="col-12 col-md-8">
                <label class="form-label" for="report-movements-product">Producto</label>
                <select id="report-movements-product" class="form-select">
                  <option value="">Todos</option>
                </select>
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h6 mb-0">Movimientos registrados</h2>
              <button id="export-movements-csv" class="btn btn-outline-primary btn-sm" type="button">
                <i class="bi bi-download me-1"></i>Exportar CSV
              </button>
            </div>
            <div id="report-movements-table"></div>
          </div>
          <div class="tab-pane fade" id="report-low-stock" role="tabpanel">
            <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
              <h2 class="h6 mb-0">Alertas de stock bajo</h2>
              <div class="d-flex gap-2">
                <button id="export-low-stock-csv" class="btn btn-outline-primary btn-sm" type="button">
                  <i class="bi bi-download me-1"></i>Exportar CSV
                </button>
                <button id="print-low-stock" class="btn btn-outline-secondary btn-sm" type="button">
                  <i class="bi bi-printer me-1"></i>Imprimir
                </button>
              </div>
            </div>
            <div id="report-low-stock-table"></div>
          </div>
          <div class="tab-pane fade" id="report-users" role="tabpanel">
            <div class="row g-3 mb-3">
              <div class="col-12 col-md-4">
                <label class="form-label" for="report-users-status">Estado</label>
                <select id="report-users-status" class="form-select">
                  <option value="">Todos</option>
                  <option value="active">Activos</option>
                  <option value="inactive">Inactivos</option>
                </select>
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h6 mb-0">Usuarios del sistema</h2>
              <button id="export-users-csv" class="btn btn-outline-primary btn-sm" type="button">
                <i class="bi bi-download me-1"></i>Exportar CSV
              </button>
            </div>
            <div id="report-users-table"></div>
          </div>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/modules/reportes.js"></script>
  </body>
</html>
