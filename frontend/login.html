<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Sistema de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        prefix: "tw-",
        corePlugins: { preflight: false },
      };
    </script>
    <link href="./css/app.css" rel="stylesheet" />
  </head>
  <body>
    <main class="auth-page d-flex align-items-center justify-content-center px-3 py-5">
      <div class="card auth-card tw-rounded-3xl tw-shadow-2xl">
        <div class="card-body p-4 p-md-5">
          <div class="d-flex align-items-center gap-3 mb-4">
            <span class="brand-mark">SI</span>
            <div>
              <p class="text-secondary mb-1">Acceso al sistema</p>
              <h1 class="h3 mb-0">Sistema de Inventario</h1>
            </div>
          </div>
          <p class="text-secondary mb-4">Inicia sesión con tus credenciales para acceder al panel administrativo.</p>
          <div id="login-feedback" class="alert alert-danger d-none" role="alert"></div>
          <form id="login-form" novalidate>
            <div class="mb-3">
              <label class="form-label" for="email">Correo electrónico</label>
              <input class="form-control form-control-lg" id="email" name="email" type="email" autocomplete="email" required />
            </div>
            <div class="mb-4">
              <label class="form-label" for="password">Contraseña</label>
              <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required />
            </div>
            <button id="login-submit" class="btn btn-primary btn-lg w-100" type="submit">Iniciar sesión</button>
          </form>
          <div class="mt-4 small text-secondary">
            Backend esperado: <strong>http://localhost:8080</strong>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/modules/login.js"></script>
  </body>
</html>
