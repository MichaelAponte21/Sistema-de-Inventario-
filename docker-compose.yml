services:
  db:
    image: postgres:14
    container_name: inventario-db
    environment:
      POSTGRES_DB: sistema_inventario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Admin
    ports:
      - "7000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - inventario-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistema_inventario"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: inventario-backend
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/sistema_inventario
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      APP_SEED_ADMIN: ${APP_SEED_ADMIN}
      APP_SEED_ADMIN_EMAIL: ${APP_SEED_ADMIN_EMAIL}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD}
      APP_SEED_ADMIN_NOMBRE: ${APP_SEED_ADMIN_NOMBRE}
      APP_CORS_ORIGIN: http://localhost:8081,http://frontend:8081
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - inventario-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: inventario-frontend
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - inventario-network

networks:
  inventario-network:
    driver: bridge

volumes:
  postgres_data:
