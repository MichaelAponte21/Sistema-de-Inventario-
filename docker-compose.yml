services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: inventario-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:7000/sistema_inventario
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      APP_SEED_ADMIN: ${APP_SEED_ADMIN}
      APP_SEED_ADMIN_EMAIL: ${APP_SEED_ADMIN_EMAIL}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD}
      APP_SEED_ADMIN_NOMBRE: ${APP_SEED_ADMIN_NOMBRE}
    ports:
      - "8080:8080"
    restart: unless-stopped
