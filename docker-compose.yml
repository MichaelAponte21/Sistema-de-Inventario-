services:
  db:
    image: postgres:16
    container_name: inventario-db
    environment:
      POSTGRES_DB: sistema_inventario_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "7000:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistema_inventario_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: inventario-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/sistema_inventario_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: VGhpc0lzQVNlY3JldEtleUZvckRldk9ubHlfQ2hhbmdlSW5Qcm9k
      JWT_EXPIRATION_MS: 86400000
      APP_SEED_ADMIN: "true"
      APP_SEED_ADMIN_EMAIL: admin@inventario.local
      APP_SEED_ADMIN_PASSWORD: Admin12345!
      APP_SEED_ADMIN_NOMBRE: Administrador
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
