spring.application.name=SistemaInventario

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:7000/sistema_inventario_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
app.jwt.secret=${JWT_SECRET:VGhpc0lzQVNlY3JldEtleUZvckRldk9ubHlfQ2hhbmdlSW5Qcm9k}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# App seed
app.seed-admin=${APP_SEED_ADMIN:true}
app.seed-admin.email=${APP_SEED_ADMIN_EMAIL:admin@inventario.local}
app.seed-admin.password=${APP_SEED_ADMIN_PASSWORD:Admin12345!}
app.seed-admin.nombre=${APP_SEED_ADMIN_NOMBRE:Administrador}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
